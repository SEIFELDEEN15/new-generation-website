<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Generation | Portal</title>
    <link rel="icon" type="image/png" href="pics/favicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandOrange: '#d9611e',
                        brandBlue: '#003366', 
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0;
            overflow: hidden; /* Prevents any scrolling on the gateway page */
        }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen w-screen">

    <!-- MAIN PORTAL CONTAINER -->
    <div class="flex flex-col md:flex-row w-full h-full relative">
        
        <!-- DAIRY DIVISION (LEFT BUTTON) -->
        <a href="dairy-home.html" class="relative flex-1 flex flex-col items-center justify-center group overflow-hidden bg-brandOrange">
            <!-- Background Image & Overlay -->
            <div class="absolute inset-0 bg-[url('pics/dairy-1.jpg')] bg-cover bg-center opacity-40 group-hover:opacity-30 transition-all duration-700 group-hover:scale-110 group-hover:rotate-1"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent z-0"></div>
            
            <!-- Content -->
            <div class="relative z-10 flex flex-col items-center transform transition-transform duration-500 group-hover:-translate-y-4">
                <div class="w-24 h-24 md:w-32 md:h-32 rounded-full border-4 border-white/80 flex items-center justify-center mb-6 backdrop-blur-md bg-white/10 group-hover:bg-white/30 group-hover:border-white transition-all duration-500 shadow-2xl shadow-black/50">
                    <i class="fa-solid fa-droplet text-5xl md:text-6xl text-white"></i>
                </div>
                <h2 class="text-5xl md:text-7xl font-extrabold text-white tracking-widest uppercase drop-shadow-xl mb-4">Dairy</h2>
                <div class="overflow-hidden">
                    <span class="block transform translate-y-full group-hover:translate-y-0 transition-transform duration-500 text-white text-lg md:text-xl tracking-[0.3em] uppercase font-light border-b border-white pb-1">
                        Enter Division
                    </span>
                </div>
            </div>
        </a>

        <!-- PHARMA / DENTAL DIVISION (RIGHT BUTTON) -->
        <a href="dental-overview.html" class="relative flex-1 flex flex-col items-center justify-center group overflow-hidden bg-brandBlue">
            <!-- Background Image & Overlay -->
            <div class="absolute inset-0 bg-[url('pics/service-4.jpg')] bg-cover bg-center opacity-40 group-hover:opacity-30 transition-all duration-700 group-hover:scale-110 group-hover:-rotate-1"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent z-0"></div>
            
            <!-- Content -->
            <div class="relative z-10 flex flex-col items-center transform transition-transform duration-500 group-hover:-translate-y-4">
                <div class="w-24 h-24 md:w-32 md:h-32 rounded-full border-4 border-white/80 flex items-center justify-center mb-6 backdrop-blur-md bg-white/10 group-hover:bg-white/30 group-hover:border-white transition-all duration-500 shadow-2xl shadow-black/50">
                    <i class="fa-solid fa-tooth text-5xl md:text-6xl text-white"></i>
                </div>
                <h2 class="text-5xl md:text-7xl font-extrabold text-white tracking-widest uppercase drop-shadow-xl mb-4">Pharma</h2>
                <div class="overflow-hidden">
                    <span class="block transform translate-y-full group-hover:translate-y-0 transition-transform duration-500 text-white text-lg md:text-xl tracking-[0.3em] uppercase font-light border-b border-white pb-1">
                        Enter Division
                    </span>
                </div>
            </div>
        </a>

        <!-- CENTER BRANDING MEDALLION -->
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-20 pointer-events-none flex items-center justify-center w-28 h-28 md:w-40 md:h-40 bg-white rounded-full shadow-[0_0_40px_rgba(0,0,0,0.5)] border-4 md:border-8 border-gray-100 overflow-hidden">
            <img src="pics/logo-2.jpg" alt="New Generation Logo" class="w-full h-full object-contain p-3 md:p-4">
        </div>

    </div>

</body>
</html>
